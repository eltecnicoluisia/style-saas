<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flyer Cyber Navy — Style SaaS & Informáticos Venezuela</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #040711;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }
    .header-bar {
      max-width: 680px;
      width: 100%;
      text-align: center;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 6px;
    }
    h1 span {
      background: linear-gradient(90deg, #00e5ff, #38bdf8, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-cyan {
      background: linear-gradient(135deg, #00e5ff, #0284c7);
      color: #040814;
      border: none;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
    }
    .btn-cyan:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 229, 255, 0.6);
    }
    .btn-outline {
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      border: 1px solid #1e293b;
    }
    .btn-outline:hover {
      background: #0f172a;
      border-color: #00e5ff;
    }
    .preview-container {
      max-width: 540px;
      width: 100%;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 50px rgba(0, 229, 255, 0.2);
      border: 1.5px solid rgba(0, 229, 255, 0.35);
      background: #070c18;
      display: flex;
      justify-content: center;
    }
    .preview-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="badge">Psicología de Color: Cyber Navy Deep • 1080 x 1920</div>
    <h1>Style SaaS — <span>Informáticos Venezuela</span></h1>
    <p class="subtitle">Diagramación simétrica balanceada, métricas en Bs. y $ protagonistas, márgenes milimétricos y colores de alta tecnología.</p>
    
    <div class="actions">
      <button class="btn btn-cyan" id="btnDownload">
        ⬇ Descargar como PNG en Alta Resolución (1080x1920)
      </button>
      <a href="./flyer_vector_profesional.svg" download="Flyer_Style_SaaS_Navy.svg" class="btn btn-outline">
        ⬇ Descargar SVG Vectorial Puro
      </a>
    </div>
  </div>

  <div class="preview-container">
    <img id="flyerImg" src="./flyer_vector_profesional.svg?v=2" alt="Flyer Cyber Navy Style SaaS">
  </div>

  <canvas id="exportCanvas" width="1080" height="1920"></canvas>

  <script>
    document.getElementById('btnDownload').addEventListener('click', function() {
      const btn = this;
      btn.innerText = 'Renderizando en 1080x1920...';
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = './flyer_vector_profesional.svg?v=' + Date.now();
      img.onload = function() {
        const canvas = document.getElementById('exportCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 1080, 1920);
        ctx.drawImage(img, 0, 0, 1080, 1920);
        
        canvas.toBlob(function(blob) {
          const a = document.createElement('a');
          a.download = 'Flyer_Style_SaaS_Informaticos_Venezuela.png';
          a.href = URL.createObjectURL(blob);
          a.click();
          btn.innerText = '✓ ¡Descargado! Descargar nuevamente';
        }, 'image/png');
      };
    });
  </script>
</body>
</html>
